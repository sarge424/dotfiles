[colors]
bg = #000000
bg-alt = #111111
bg-soft = #1a1a1a

fg = #e0e0e0
fg-dim = #9a9a9a

accent = #7aa2f7
accent-alt = #89b4fa

urgent = #f7768e


[bar/main]
width = 100%
height = 36
radius = 0

background = ${colors.bg}
foreground = ${colors.fg}

border-size = 0

padding-left = 4
padding-right = 4

module-margin = 3

font-0 = "CommitMonoNerdFont:size=13;3"
font-1 = "Symbols Nerd Font Mono:size=14;3"

modules-center = date
modules-right = wlan battery tray

tray-position = right
tray-padding = 2
tray-background = ${colors.bg}

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
wm-restack = i3

line-size = 2
line-color = ${colors.accent}


[module/date]
type = internal/date

interval = 1

date = %a %d %b %H:%M

label = %date%
label-foreground = ${colors.accent-alt}


[module/wlan]
type = internal/network

interface-type = wireless

interval = 3

format-connected = <label-connected>
format-disconnected = <label-disconnected>

label-connected = 󰖩 %essid%
label-connected-foreground = ${colors.fg-dim}

label-disconnected = 󰖪 offline
label-disconnected-foreground = ${colors.fg-dim}


[module/battery]
type = internal/battery

battery = BAT0
adapter = AC

full-at = 98

format-charging = <label-charging>
format-discharging = <label-discharging>
format-full = <label-full>

label-charging = 󰂄 %percentage%%
label-discharging = 󰁹 %percentage%%
label-full = 󰁹 full

label-charging-foreground = ${colors.fg-dim}
label-discharging-foreground = ${colors.fg-dim}
label-full-foreground = ${colors.fg-dim}


[module/tray]
type = internal/tray

format-margin = 8px
tray-spacing = 8px